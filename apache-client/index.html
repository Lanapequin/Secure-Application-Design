<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Workshop Client</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 { color: #00ff88; margin-bottom: 1rem; font-size: 1.8rem; }
        .card {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 1.5rem;
            margin: 1rem 0;
        }
        .card h3 { color: #00ff88; margin-bottom: 0.5rem; }
        button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            margin: 4px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        pre {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            padding: 1rem;
            margin-top: 1rem;
            white-space: pre-wrap;
            color: #7fff7f;
            min-height: 60px;
        }
        .badge {
            display: inline-block;
            background: #00ff8822;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 2px 8px;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        .url-display {
            color: #888;
            font-size: 0.85rem;
            margin: 4px 0;
        }
    </style>
</head>
<body>
<h1>Secure Workshop Client <span class="badge">TLS</span></h1>
<p style="color:#888; margin-bottom:1.5rem;">
    Servido desde Apache (Server 1) · API en Spring (Server 2)
</p>

<!-- Config -->
<div class="card">
    <h3>⚙Configuración</h3>
    <label>Spring API URL:</label>
    <input id="apiUrl" type="text"
           value="https://TU_DOMINIO_SPRING:8443"
           style="width:100%;padding:8px;background:#1a1a1a;color:#fff;
                      border:1px solid #333;font-family:monospace;margin-top:4px;" />
</div>

<!-- Test público -->
<div class="card">
    <h3>API Pública</h3>
    <p class="url-display">GET /api/public/status</p>
    <button onclick="testPublic()">▶ Ejecutar</button>
    <pre id="publicResult">// Presiona el botón...</pre>
</div>

<!-- Test protegido -->
<div class="card">
    <h3>API Protegida</h3>
    <p class="url-display">GET /api/secure/profile</p>
    <button onclick="testSecure()">▶ Ejecutar</button>
    <pre id="secureResult">// Requiere autenticación...</pre>
</div>

<!-- Info TLS -->
<div class="card">
    <h3>Estado TLS</h3>
    <pre id="tlsInfo">// Cargando info del protocolo...</pre>
</div>

<script>
    // Mostrar info TLS actual
    document.getElementById('tlsInfo').textContent =
        `Protocolo:  ${window.location.protocol}
Origen:     ${window.location.origin}
Conexión:   ${window.isSecureContext ? 'Contexto seguro (HTTPS)' : 'No seguro'}`;

    function getApiUrl() {
        return document.getElementById('apiUrl').value;
    }

    // Llamada async a endpoint público
    async function testPublic() {
        const el = document.getElementById('publicResult');
        el.textContent = 'Conectando...';
        try {
            const res = await fetch(`${getApiUrl()}/api/public/status`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            el.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
            el.textContent = `Error: ${err.message}\n\nVerifica:\n- La URL del servidor Spring\n- Que el certificado TLS sea válido`;
        }
    }

    // Llamada async a endpoint protegido
    async function testSecure() {
        const el = document.getElementById('secureResult');
        el.textContent = 'Conectando...';
        try {
            const res = await fetch(`${getApiUrl()}/api/secure/profile`, {
                credentials: 'include'
            });
            if (res.status === 401 || res.status === 403) {
                el.textContent = 'No autenticado. Inicia sesión primero en Spring.';
                return;
            }
            const data = await res.json();
            el.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
            el.textContent = `Error: ${err.message}`;
        }
    }
</script>
</body>
</html>
