# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:workshopdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# TLS (configurar después en EC2 con certificado real)
# server.port=8443
# server.ssl.enabled=true
# server.ssl.key-store=/etc/letsencrypt/live/TU_DOMINIO/keystore.p12
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store-password=tu_password

# Puerto HTTP para desarrollo local
server.port=8080

# Logs
logging.level.org.springframework.security=DEBUG