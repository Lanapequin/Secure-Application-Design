<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Home — Secure App</title>
    <style>
        body { font-family: monospace; background: #0f0f0f; color: #00ff88;
               padding: 2rem; }
        button { background: #00ff88; color: #000; border: none;
                 padding: 8px 16px; cursor: pointer; margin: 4px; }
        pre { background: #1a1a1a; padding: 1rem; border: 1px solid #333; }
    </style>
</head>
<body>
<h1>✅ Panel Seguro</h1>
<p>Bienvenido, <strong sec:authentication="name">usuario</strong></p>

<h3>🔌 Test API REST (async JS)</h3>
<button onclick="callPublicApi()">GET /api/public/status</button>
<button onclick="callSecureApi()">GET /api/secure/profile</button>
<pre id="output">// Resultado aquí...</pre>

<br>
<a href="/logout">
    <button>Cerrar Sesión</button>
</a>

<script>
    const API_BASE = window.location.protocol + '//' + window.location.hostname;

    async function callPublicApi() {
        try {
            // Llamada asíncrona al endpoint público
            const response = await fetch(`${API_BASE}:8443/api/public/status`);
            const data = await response.json();
            document.getElementById('output').textContent =
                JSON.stringify(data, null, 2);
        } catch(e) {
            document.getElementById('output').textContent = 'Error: ' + e.message;
        }
    }

    async function callSecureApi() {
        try {
            // Llamada asíncrona al endpoint protegido
            const response = await fetch(`${API_BASE}:8443/api/secure/profile`, {
                credentials: 'include'
            });
            const data = await response.json();
            document.getElementById('output').textContent =
                JSON.stringify(data, null, 2);
        } catch(e) {
            document.getElementById('output').textContent = 'Error: ' + e.message;
        }
    }
</script>
</body>
</html>
