<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — Secure App</title>
    <style>
        body { font-family: monospace; background: #0f0f0f; color: #00ff88;
               display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { border: 1px solid #00ff88; padding: 2rem; width: 320px; }
        input { width: 100%; padding: 8px; margin: 8px 0; background: #1a1a1a;
                color: #00ff88; border: 1px solid #333; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #00ff88;
                 color: #0f0f0f; border: none; cursor: pointer; font-weight: bold; }
        .err { color: #ff4444; }
        .ok  { color: #00ff88; }
        a { color: #00ff88; }
    </style>
</head>
<body>
<div class="box">
    <h2>⚡ SECURE LOGIN</h2>
    <p th:if="${param.error}" class="err">Credenciales inválidas</p>
    <p th:if="${param.logout}" class="ok">Sesión cerrada</p>
    <p th:if="${param.registered}" class="ok">Registrado. Inicia sesión.</p>

    <form method="post" th:action="@{/login}">
        <input type="text" name="username" placeholder="Usuario" required/>
        <input type="password" name="password" placeholder="Contraseña" required/>
        <button type="submit">INGRESAR</button>
    </form>
    <br>
    <a href="/register">¿No tienes cuenta? Registrarse</a>
</div>
</body>
</html>
